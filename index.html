<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕트벽체 작업지시서 변환기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f7f8fa;
    color: #1a1a1a;
    line-height: 1.5;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #0a0a0a;
  }
  header p { font-size: 14px; color: #6a6a6a; }
  .badge-multi {
    display: inline-block;
    background: #dbeafe;
    color: #1e40af;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .step-label {
    font-size: 12px;
    font-weight: 600;
    color: #2563eb;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .upload-zone {
    border: 2px dashed #d1d5db;
    border-radius: 10px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: #fafbfc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 140px;
    width: 100%;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .upload-icon { font-size: 28px; color: #9ca3af; }
  .upload-text { font-size: 14px; color: #374151; font-weight: 500; }
  .upload-hint { font-size: 12px; color: #9ca3af; }
  input[type="file"] { display: none; }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  label.field { display: block; margin-bottom: 10px; }
  label.field span {
    display: block;
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 4px;
    font-weight: 500;
  }
  /* 파일 목록 스타일 */
  .file-list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: #6b7280;
  }
  .file-item {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #ffffff;
    overflow: hidden;
    transition: all 0.15s;
  }
  .file-item.expanded {
    border-color: #93c5fd;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
  }
  .file-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .file-header:hover { background: #f9fafb; }
  .file-icon { font-size: 18px; flex-shrink: 0; }
  .file-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .file-name {
    font-size: 13px;
    font-weight: 500;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta {
    font-size: 11px;
    color: #6b7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .status-ready { background: #f3f4f6; color: #6b7280; }
  .status-success { background: #d1fae5; color: #065f46; }
  .status-error { background: #fee2e2; color: #991b1b; }
  .expand-icon {
    color: #9ca3af;
    transition: transform 0.15s;
    font-size: 14px;
    flex-shrink: 0;
  }
  .file-item.expanded .expand-icon { transform: rotate(90deg); }
  .file-body {
    display: none;
    padding: 0 14px 14px 14px;
    border-top: 1px solid #f3f4f6;
    padding-top: 14px;
  }
  .file-item.expanded .file-body { display: block; }
  .file-action-btn {
    background: none;
    border: none;
    color: #6b7280;
    cursor: pointer;
    padding: 4px 6px;
    font-size: 14px;
    border-radius: 4px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .file-action-btn:hover { background: #f3f4f6; color: #374151; }
  .file-action-btn.remove:hover { color: #dc2626; background: #fef2f2; }
  .file-actions {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .preview-title {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin: 12px 0 8px;
  }
  .preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
  }
  .preview-table th {
    background: #f3f4f6;
    padding: 6px 8px;
    text-align: center;
    font-weight: 500;
    font-size: 11px;
    color: #374151;
    border-bottom: 1px solid #e5e7eb;
    border-right: 1px solid #e5e7eb;
  }
  .preview-table th:last-child { border-right: none; }
  .preview-table td {
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid #f3f4f6;
    border-right: 1px solid #f3f4f6;
    background: #ffffff;
  }
  .preview-table td:last-child { border-right: none; }
  .preview-table tbody tr:last-child td { border-bottom: none; }
  .preview-table .merged-cell {
    background: #f9fafb;
    vertical-align: middle;
    font-weight: 500;
  }
  .error-msg {
    background: #fef2f2;
    color: #991b1b;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  button {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary { background: #2563eb; color: white; flex: 1; }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-secondary {
    background: #ffffff;
    color: #374151;
    border: 1px solid #d1d5db;
    flex: 0 0 auto;
  }
  .btn-secondary:hover:not(:disabled) { background: #f9fafb; }
  .btn-secondary:disabled { color: #9ca3af; cursor: not-allowed; }
  .btn-download-single {
    background: #10b981;
    color: white;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
  }
  .btn-download-single:hover { background: #059669; }
  .status {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }
  .status.error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    display: block;
  }
  .status.success {
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
    display: block;
  }
  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: #9ca3af;
    font-size: 13px;
  }
  .summary-bar {
    display: flex;
    gap: 16px;
    padding: 10px 14px;
    background: #f9fafb;
    border-radius: 6px;
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 12px;
  }
  .summary-bar strong {
    color: #111827;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>덕트벽체 작업지시서 변환기<span class="badge-multi">다중 파일 지원</span></h1>
    <p>여러 개의 다중 산출기 파일을 한 번에 업로드하면 sheet와 plate로 분리된 작업지시서로 일괄 변환합니다</p>
  </header>

  <div class="card">
    <div class="step-label">1. 파일 선택 (여러 개 가능)</div>
    <label for="fileInput" class="upload-zone" id="uploadZone">
      <div class="upload-icon">📄</div>
      <div class="upload-text">클릭하여 업로드 또는 파일을 끌어다 놓으세요</div>
      <div class="upload-hint">여러 개의 .xlsx 파일을 한 번에 선택 가능</div>
    </label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
  </div>

  <div class="card" id="fileListCard" style="display:none;">
    <div class="step-label">2. 파일 목록 및 편집</div>
    <div class="summary-bar" id="summaryBar"></div>
    <div id="fileList"></div>
  </div>

  <div class="card">
    <div class="btn-row">
      <button class="btn-secondary" id="resetBtn" disabled>모두 삭제</button>
      <button class="btn-primary" id="downloadAllBtn" disabled>전체 ZIP으로 다운로드</button>
    </div>
    <div class="status" id="statusMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';

let files = []; // { id, file, originalName, parsedData, siteName, outputFileName, status, error, expanded }
let nextId = 1;

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const fileListCard = document.getElementById('fileListCard');
const fileList = document.getElementById('fileList');
const summaryBar = document.getElementById('summaryBar');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const resetBtn = document.getElementById('resetBtn');
const statusMsg = document.getElementById('statusMsg');

// 드래그 앤 드롭
['dragover', 'dragenter'].forEach(evt => {
  uploadZone.addEventListener(evt, e => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  uploadZone.addEventListener(evt, e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
  });
});
uploadZone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) addFiles(Array.from(e.target.files));
  e.target.value = ''; // 같은 파일 재업로드 가능
});

resetBtn.addEventListener('click', () => {
  if (!confirm('모든 파일을 목록에서 제거하시겠습니까?')) return;
  files = [];
  render();
  clearStatus();
});

downloadAllBtn.addEventListener('click', downloadAll);

// 표시/숨김은 CSS 클래스(.status / .status.error / .status.success)로만 제어
// (style.display를 직접 바꾸면 그 뒤 메시지가 계속 숨겨짐)
function showStatus(msg, type) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status ' + type;
}

function clearStatus() {
  statusMsg.textContent = '';
  statusMsg.className = 'status';
}

// ============================================================
// 파일 추가 및 파싱
// ============================================================
async function addFiles(newFiles) {
  clearStatus();
  const xlsxFiles = newFiles.filter(f => /\.xlsx?$/i.test(f.name));
  if (xlsxFiles.length === 0) {
    showStatus('.xlsx 파일만 업로드 가능합니다', 'error');
    return;
  }
  
  for (const file of xlsxFiles) {
    const entry = {
      id: 'file_' + (nextId++),
      file,
      originalName: file.name,
      parsedData: null,
      siteName: '',
      outputFileName: '',
      status: 'ready',
      error: null,
      expanded: false
    };
    files.push(entry);
    
    try {
      const buffer = await file.arrayBuffer();
      // cellStyles: 숨김 열 정보(!cols)를 읽으려면 필요
      const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellStyles: true });
      entry.parsedData = parseWorkbook(wb);
      entry.siteName = entry.parsedData.siteName;
      entry.outputFileName = suggestOutputName(file.name);
      entry.status = 'success';
    } catch (err) {
      console.error(err);
      entry.status = 'error';
      entry.error = err.message || String(err);
    }
  }
  render();
}

// ============================================================
// 원본 파일 파싱
// ============================================================
function parseWorkbook(wb) {
  const siteName = extractSiteName(wb);

  const 지시시트 = wb.Sheets['채움재작업지시서'];
  if (!지시시트) throw new Error('"채움재작업지시서" 시트를 찾을 수 없습니다');

  const blocks = findBlocks(지시시트);
  if (blocks.length === 0) {
    throw new Error('"채움재작업지시서" 시트에서 "내화채움판" 머리글을 찾을 수 없습니다');
  }

  // 화면에 보이는 표부터 읽고, 데이터가 있는 첫 표를 사용
  for (const block of blocks) {
    const data = readBlock(지시시트, block);
    if (data.채움재.length > 0 || data.내화채움판.length > 0) {
      return { siteName, ...data };
    }
  }
  throw new Error('유효한 데이터를 찾을 수 없습니다 (채움재작업지시서 시트 확인 필요)');
}

function cellText(ws, r, c) {
  if (r < 0 || c < 0) return '';
  const cell = ws[XLSX.utils.encode_cell({ r, c })];
  return cell && cell.v != null ? String(cell.v) : '';
}

function colRange(from, to) {
  const cols = [];
  for (let c = from; c <= to; c++) cols.push(c);
  return cols;
}

// 열 목록에서 test를 만족하는 첫 열, 없으면 fallback
function pickCol(cols, test, fallback) {
  for (const c of cols) if (c >= 0 && test(c)) return c;
  return fallback;
}

// 채움재작업지시서에서 표 위치 찾기.
// 같은 표가 좌우로 두 벌(B~G: 숨김 + 수식, P~U: 화면에 보이는 값) 있을 수 있어서
// 보이는 표를 먼저, 그다음 오른쪽 표 순서로 돌려줌.
function findBlocks(ws) {
  if (!ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const colInfo = ws['!cols'] || [];
  const blocks = [];

  for (let r = range.s.r; r <= Math.min(range.e.r, range.s.r + 20) && blocks.length === 0; r++) {
    const isQty = c => cellText(ws, r, c).includes('수량');
    const isSheetHeader = c => {
      const t = cellText(ws, r, c);
      return t.includes('채움재') && !t.includes('내화');
    };
    for (let c = range.s.c; c <= range.e.c; c++) {
      if (!cellText(ws, r, c).includes('내화채움판')) continue;
      const sheetCol = pickCol(colRange(c - 6, c - 1).reverse(), isSheetHeader, c - 3);
      blocks.push({
        headerRow: r,
        sheetCol,
        sheetQtyCol: pickCol(colRange(sheetCol + 1, c - 1), isQty, c - 1),
        plateCol: c,
        plateQtyCol: pickCol(colRange(c + 1, c + 3), isQty, c + 1),
        hidden: !!(colInfo[c] && colInfo[c].hidden)
      });
    }
  }

  blocks.sort((a, b) => (a.hidden - b.hidden) || (b.plateCol - a.plateCol));
  return blocks;
}

function readBlock(ws, block) {
  const range = XLSX.utils.decode_range(ws['!ref']);
  const 채움재 = [];
  const 내화채움판 = [];

  for (let r = block.headerRow + 1; r <= range.e.r; r++) {
    // '합계 / Total' 행에서 멈춤
    const rowText = colRange(block.sheetCol - 1, block.plateQtyCol).map(c => cellText(ws, r, c)).join(' ');
    if (/합계|total/i.test(rowText)) break;

    const sheetSize = parseSizeString(cellText(ws, r, block.sheetCol));
    const sheetQty = toQty(cellText(ws, r, block.sheetQtyCol));
    if (sheetSize && sheetQty > 0) 채움재.push({ ...sheetSize, qty: sheetQty });

    const plateQty = toQty(cellText(ws, r, block.plateQtyCol));
    if (plateQty > 0) {
      parsePlateCell(cellText(ws, r, block.plateCol))
        .forEach(plate => 내화채움판.push({ ...plate, qty: plateQty }));
    }
  }

  return { 채움재, 내화채움판 };
}

function toQty(value) {
  const n = Number(String(value).replace(/,/g, ''));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

const SIZE_RE = /(\d+)\s*[*×xX]\s*(\d+)/;

function parseSizeString(str) {
  const m = String(str || '').match(SIZE_RE);
  return m ? { length: parseInt(m[1], 10), width: parseInt(m[2], 10) } : null;
}

// 내화채움판 셀 → [{ position, length, width }, ...]
// "전면: 850 * 200\n후면: 850 * 150"처럼 한 셀에 전면·후면이 같이 있으면 front/back으로 각각 분리.
// 규격마다 바로 앞의 라벨을 따르고, 앞에 라벨이 없으면 셀의 첫 라벨, 라벨이 아예 없으면 front.
function parsePlateCell(str) {
  const s = String(str || '');
  const labels = [];
  const labelRe = /전면|앞면|front|후면|뒷면|뒤면|back/gi;
  let m;
  while ((m = labelRe.exec(s)) !== null) {
    labels.push({ index: m.index, position: /후면|뒷면|뒤면|back/i.test(m[0]) ? 'back' : 'front' });
  }

  const plates = [];
  const sizeRe = new RegExp(SIZE_RE.source, 'g');
  while ((m = sizeRe.exec(s)) !== null) {
    const sizeIndex = m.index;
    const before = labels.filter(l => l.index < sizeIndex);
    const label = before.length > 0 ? before[before.length - 1] : labels[0];
    plates.push({
      position: label ? label.position : 'front',
      length: parseInt(m[1], 10),
      width: parseInt(m[2], 10)
    });
  }
  return plates;
}

// 현장명 원문 찾기: '/'가 들어간 셀 우선
// (예: 다중산출기 C1 "덕트 입상(FS-0000)/지역-업체명(000000-0000)")
// 예전 양식은 A1에 있었으므로 함께 확인하고, 날짜 문자열은 건너뜀
function extractSiteName(wb) {
  const isDate = s => /^\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.?$/.test(s);
  const candidates = [
    ['다중산출기', 'C1'], ['다중산출기', 'A1'],
    ['채움재작업지시서', 'R5'], ['채움재작업지시서', 'D5']
  ].map(([sheetName, addr]) => {
    const cell = wb.Sheets[sheetName] && wb.Sheets[sheetName][addr];
    return cell && cell.t === 's' ? String(cell.v).trim() : '';
  }).filter(s => s && !isDate(s));

  const raw = candidates.find(s => s.includes('/')) || candidates[0] || '';
  return raw ? formatSiteName(raw) : '';
}

// "덕트 입상(FS-0000)/지역-업체명(000000-0000)" → "지역 - 업체명(000000-0000)입상"
// 예전 형식 ".../지역_업체_코드" → "지역 - 업체(코드)"
function formatSiteName(raw) {
  const slashIdx = raw.indexOf('/');
  const head = slashIdx >= 0 ? raw.substring(0, slashIdx) : '';
  let target = (slashIdx >= 0 ? raw.substring(slashIdx + 1) : raw).trim();
  target = target.replace(/(\d{6})_(\d{3,4})/g, '$1-$2'); // 발주번호 000000_0000 → 000000-0000

  const parts = target.split('_').filter(p => p);
  if (parts.length >= 3) {
    const code = parts[parts.length - 1];
    const middle = parts.slice(1, -1).join(' - ');
    target = `${parts[0]} - ${middle}(${code})`;
  } else {
    // 첫 하이픈만 " - "로 (괄호 안 발주번호의 하이픈은 그대로)
    const m = target.match(/^([^-(]+?)\s*-\s*(.+)$/);
    if (m) target = `${m[1]} - ${m[2]}`;
  }

  // 제품 구분 붙이기: "덕트 입상(...)" → "입상", "덕트 벽체(...)" → "벽체"
  const type = head.match(/덕트\s*([가-힣]+)/);
  return (target || raw) + (type ? type[1] : '');
}

function suggestOutputName(origName) {
  let base = origName.replace(/\.xlsx?$/i, '');
  base = base.replace(/^.*?산출기[^_]*__?/, '');
  return `${base}_작업지시서.xlsx`;
}

function groupByWidth(items) {
  const map = new Map();
  items.forEach(item => {
    if (!map.has(item.width)) map.set(item.width, []);
    map.get(item.width).push(item);
  });
  const groups = Array.from(map, ([width, items]) => ({
    width,
    items: items.slice().sort((a, b) => b.length - a.length)
  }));
  groups.sort((a, b) => b.width - a.width);
  return groups;
}

// plate를 front → back 순서로 묶음 (데이터 없는 쪽은 뺌)
function getPlateBlocks(plates) {
  return ['front', 'back']
    .map(position => ({ position, groups: groupByWidth(plates.filter(p => p.position === position)) }))
    .filter(block => block.groups.length > 0);
}

function escapeHtml(str) {
  return String(str).replace(/[<>&"']/g, c => ({
    '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ============================================================
// UI 렌더링
// ============================================================
function render() {
  if (files.length === 0) {
    fileListCard.style.display = 'none';
    downloadAllBtn.disabled = true;
    resetBtn.disabled = true;
    return;
  }
  
  fileListCard.style.display = 'block';
  const successCount = files.filter(f => f.status === 'success').length;
  const errorCount = files.filter(f => f.status === 'error').length;
  
  downloadAllBtn.disabled = successCount === 0;
  downloadAllBtn.textContent = successCount > 0 
    ? `전체 ZIP으로 다운로드 (${successCount}개)`
    : `전체 ZIP으로 다운로드`;
  resetBtn.disabled = false;
  
  // 요약 바
  summaryBar.innerHTML = `
    <span>총 <strong>${files.length}</strong>개</span>
    <span>변환 성공 <strong style="color:#10b981">${successCount}</strong>개</span>
    ${errorCount > 0 ? `<span>오류 <strong style="color:#dc2626">${errorCount}</strong>개</span>` : ''}
  `;
  
  // 파일 리스트
  fileList.innerHTML = files.map(renderFileItem).join('');
  
  // 이벤트 바인딩
  files.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    
    el.querySelector('.file-header').addEventListener('click', e => {
      if (e.target.closest('.file-action-btn') || e.target.closest('.btn-download-single')) return;
      f.expanded = !f.expanded;
      render();
    });
    
    const removeBtn = el.querySelector('.remove');
    if (removeBtn) {
      removeBtn.addEventListener('click', () => {
        files = files.filter(x => x.id !== f.id);
        render();
      });
    }
    
    const downloadBtn = el.querySelector('.btn-download-single');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', () => downloadSingle(f));
    }
    
    const siteInput = el.querySelector('.site-input');
    if (siteInput) {
      siteInput.addEventListener('input', e => {
        f.siteName = e.target.value;
      });
    }
    const nameInput = el.querySelector('.name-input');
    if (nameInput) {
      nameInput.addEventListener('input', e => {
        f.outputFileName = e.target.value;
      });
    }
  });
}

function renderFileItem(f) {
  const icon = f.status === 'success' ? '✓' : f.status === 'error' ? '✕' : '•';
  const iconColor = f.status === 'success' ? '#10b981' : f.status === 'error' ? '#dc2626' : '#9ca3af';
  const badgeClass = 'status-' + f.status;
  const badgeText = f.status === 'success' ? '성공' : f.status === 'error' ? '오류' : '대기';
  
  let body = '';
  if (f.status === 'error') {
    body = `<div class="file-body"><div class="error-msg">⚠ ${escapeHtml(f.error)}</div></div>`;
  } else if (f.status === 'success' && f.parsedData) {
    body = `
      <div class="file-body">
        <label class="field">
          <span>현장명</span>
          <input type="text" class="site-input" value="${escapeHtml(f.siteName)}">
        </label>
        <label class="field">
          <span>저장할 파일명</span>
          <input type="text" class="name-input" value="${escapeHtml(f.outputFileName)}">
        </label>
        ${renderPreview(f)}
      </div>
    `;
  }
  
  return `
    <div class="file-item ${f.expanded ? 'expanded' : ''}" id="${f.id}">
      <div class="file-header">
        <span class="file-icon" style="color:${iconColor}">${icon}</span>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.originalName)}</div>
          <div class="file-meta">${f.status === 'success' ? '→ ' + escapeHtml(f.outputFileName) : (f.error || '대기 중')}</div>
        </div>
        <span class="status-badge ${badgeClass}">${badgeText}</span>
        <div class="file-actions">
          ${f.status === 'success' ? '<button class="btn-download-single" title="이 파일만 다운로드">다운로드</button>' : ''}
          <button class="file-action-btn remove" title="목록에서 제거">✕</button>
          <span class="expand-icon">▶</span>
        </div>
      </div>
      ${body}
    </div>
  `;
}

function renderPreview(f) {
  const title = f.siteName || f.parsedData.siteName;
  const 채움재Grouped = groupByWidth(f.parsedData.채움재);
  const plateBlocks = getPlateBlocks(f.parsedData.내화채움판);

  let html = '';
  html += `<div class="preview-title">채움재 <span style="font-weight:400;color:#6b7280">${escapeHtml(title)}</span></div>`;
  html += '<table class="preview-table">';
  html += '<thead><tr><th style="width:20%">폭</th><th style="width:20%">길이</th><th style="width:20%">수량</th><th style="width:20%">sheet</th><th style="width:20%">차열재</th></tr></thead><tbody>';
  if (채움재Grouped.length === 0) {
    html += '<tr><td colspan="5" style="color:#9ca3af">데이터 없음</td></tr>';
  } else {
    채움재Grouped.forEach(group => {
      group.items.forEach((item, i) => {
        html += '<tr>';
        if (i === 0) html += `<td class="merged-cell" rowspan="${group.items.length}">${group.width}</td>`;
        html += `<td>${item.length}</td><td>${item.qty}</td><td></td><td></td></tr>`;
      });
    });
  }
  html += '</tbody></table>';

  html += `<div class="preview-title">Plate <span style="font-weight:400;color:#6b7280">${escapeHtml(title)}</span></div>`;
  html += '<table class="preview-table">';
  html += '<thead><tr><th style="width:20%">plate</th><th style="width:20%">폭</th><th style="width:20%">길이</th><th style="width:20%">수량</th><th style="width:20%">sheet</th></tr></thead><tbody>';
  if (plateBlocks.length === 0) {
    html += '<tr><td colspan="5" style="color:#9ca3af">데이터 없음</td></tr>';
  } else {
    plateBlocks.forEach(block => { html += renderPlateRows(block.position, block.groups); });
  }
  html += '</tbody></table>';
  return html;
}

function renderPlateRows(position, grouped) {
  const totalRows = grouped.reduce((sum, g) => sum + g.items.length, 0);
  let html = '';
  let first = true;
  grouped.forEach(group => {
    group.items.forEach((item, i) => {
      html += '<tr>';
      if (first) {
        html += `<td class="merged-cell" rowspan="${totalRows}">${position}</td>`;
        first = false;
      }
      if (i === 0) html += `<td class="merged-cell" rowspan="${group.items.length}">${group.width}</td>`;
      html += `<td>${item.length}</td><td>${item.qty}</td><td></td></tr>`;
    });
  });
  return html;
}

// ============================================================
// 엑셀 파일 생성
// ============================================================
// 행 높이와 한 페이지에 들어가는 행 수
// A4 세로·기본 여백(위/아래 0.75")의 인쇄 높이 약 733pt ÷ 25.5pt = 28행
const ROW_HEIGHT_PT = 25.5;
const ROWS_PER_PAGE = 28;

function buildWorkbook(f) {
  const title = f.siteName || f.parsedData.siteName;
  const 채움재Grouped = groupByWidth(f.parsedData.채움재);
  const plateBlocks = getPlateBlocks(f.parsedData.내화채움판);

  const aoa = [];
  const merges = [];
  const spacerRows = new Set(); // 페이지를 넘기려고 넣은 빈 행 (테두리 없음)
  const merge = (r1, c1, r2, c2) => {
    if (r2 > r1 || c2 > c1) merges.push({ s: { r: r1, c: c1 }, e: { r: r2, c: c2 } });
  };

  // 섹션 1: 채움재
  merge(0, 0, 0, 4);
  aoa.push([title, '', '', '', '']);
  aoa.push(['폭', '길이', '수량', 'sheet', '차열재']);
  채움재Grouped.forEach(group => {
    const groupStart = aoa.length;
    group.items.forEach((item, i) => {
      aoa.push([i === 0 ? group.width : '', item.length, item.qty, '', '']);
    });
    merge(groupStart, 0, aoa.length - 1, 0);
  });

  // 섹션 2: Plate (front/back 중 데이터 있는 쪽만)
  if (plateBlocks.length > 0) {
    aoa.push(['', '', '', '', '']);

    // plate 표가 지금 페이지에 다 안 들어가면 다음 페이지 첫 행부터 시작
    const plateRowCount = 2 + plateBlocks.reduce(
      (sum, block) => sum + block.groups.reduce((n, g) => n + g.items.length, 0), 0);
    const usedOnPage = aoa.length % ROWS_PER_PAGE;
    if (usedOnPage > 0 && usedOnPage + plateRowCount > ROWS_PER_PAGE) {
      while (aoa.length % ROWS_PER_PAGE !== 0) {
        spacerRows.add(aoa.length);
        aoa.push([]);
      }
    }

    const titleRow = aoa.length;
    aoa.push([title, '', '', '', '']);
    merge(titleRow, 0, titleRow, 4);
    aoa.push(['plate', '폭', '길이', '수량', 'sheet']);

    plateBlocks.forEach(block => {
      const blockStart = aoa.length;
      block.groups.forEach(group => {
        const groupStart = aoa.length;
        group.items.forEach((item, i) => {
          const positionCell = aoa.length === blockStart ? block.position : '';
          aoa.push([positionCell, i === 0 ? group.width : '', item.length, item.qty, '']);
        });
        merge(groupStart, 1, aoa.length - 1, 1);
      });
      merge(blockStart, 0, aoa.length - 1, 0);
    });
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }];
  // 엑셀 기본(보통) 여백을 명시 — ROWS_PER_PAGE 계산의 기준
  ws['!margins'] = { left: 0.7, right: 0.7, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 };

  const cellStyle = {
    font: { name: '맑은 고딕', sz: 14, bold: true },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: {
      top:    { style: 'thin', color: { rgb: '000000' } },
      bottom: { style: 'thin', color: { rgb: '000000' } },
      left:   { style: 'thin', color: { rgb: '000000' } },
      right:  { style: 'thin', color: { rgb: '000000' } }
    }
  };

  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = range.s.r; R <= range.e.r; R++) {
    if (spacerRows.has(R)) continue;
    for (let C = range.s.c; C <= range.e.c; C++) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      ws[addr].s = cellStyle;
    }
  }

  // 빈 행까지 모든 행 높이를 고정해야 페이지 계산이 맞음
  ws['!rows'] = Array.from({ length: range.e.r + 1 }, () => ({ hpt: ROW_HEIGHT_PT }));

  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, ws, '작업지시서');
  return newWb;
}

function downloadSingle(f) {
  try {
    const wb = buildWorkbook(f);
    const outName = f.outputFileName.endsWith('.xlsx') ? f.outputFileName : f.outputFileName + '.xlsx';
    XLSX.writeFile(wb, outName);
    showStatus(`"${outName}" 다운로드 완료`, 'success');
  } catch (err) {
    console.error(err);
    showStatus('다운로드 오류: ' + err.message, 'error');
  }
}

async function downloadAll() {
  const successFiles = files.filter(f => f.status === 'success');
  if (successFiles.length === 0) return;

  // 파일이 1개면 그냥 개별 다운로드
  if (successFiles.length === 1) {
    downloadSingle(successFiles[0]);
    return;
  }

  try {
    downloadAllBtn.disabled = true;
    downloadAllBtn.textContent = 'ZIP 생성 중...';
    
    const zip = new JSZip();
    for (const f of successFiles) {
      const wb = buildWorkbook(f);
      const outName = f.outputFileName.endsWith('.xlsx') ? f.outputFileName : f.outputFileName + '.xlsx';
      // XLSX를 array로 write하여 zip에 추가
      const wbArray = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      zip.file(outName, wbArray);
    }
    
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
    a.href = url;
    a.download = `작업지시서_일괄변환_${dateStr}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showStatus(`${successFiles.length}개 파일을 ZIP으로 다운로드했습니다`, 'success');
  } catch (err) {
    console.error(err);
    showStatus('ZIP 생성 오류: ' + err.message, 'error');
  } finally {
    downloadAllBtn.disabled = false;
    render();
  }
}
</script>
