<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문서 변환기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 26px;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 30px;
  }
  .field { margin-bottom: 22px; }
  .label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
  }
  .file-drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed #c4c8d4;
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #fafbff;
    min-height: 140px;
  }
  .file-drop:hover, .file-drop.dragging {
    border-color: #667eea;
    background: #f0f3ff;
  }
  .file-drop input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .file-drop .icon {
    width: 44px;
    height: 44px;
    margin-bottom: 12px;
    color: #8a91a8;
    transition: color 0.2s;
  }
  .file-drop:hover .icon, .file-drop.dragging .icon { color: #667eea; }
  .file-drop .text {
    color: #555;
    font-size: 14px;
    line-height: 1.5;
  }
  .file-drop .text strong { color: #667eea; font-weight: 600; }
  .file-drop .filename {
    margin-top: 12px;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid #d8dceb;
    border-radius: 6px;
    color: #333;
    font-size: 13px;
    font-weight: 500;
    word-break: break-all;
    max-width: 100%;
    display: none;
  }
  .file-drop.has-file .filename { display: inline-block; }
  .file-drop.has-file .text { display: none; }
  .format-group {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .format-option {
    border: 2px solid #e1e4ed;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fff;
  }
  .format-option:hover { border-color: #b8bfd4; }
  .format-option.selected {
    border-color: #667eea;
    background: #f0f3ff;
    color: #667eea;
  }
  .format-option .fmt-icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .format-option .fmt-name { font-weight: 600; font-size: 15px; }
  .format-option input[type="radio"] { display: none; }
  .convert-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    margin-top: 10px;
  }
  .convert-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .convert-btn:active:not(:disabled) { transform: translateY(0); }
  .convert-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: #e8f0ff; color: #2c5aa0; }
  .status.success { background: #e6f7ed; color: #1f7a3f; }
  .status.error { background: #fce8e8; color: #b3261e; }
  .download-area { margin-top: 16px; display: none; }
  .download-area.show { display: block; }
  .download-link {
    display: block;
    padding: 12px 16px;
    background: #fff;
    border: 2px solid #1f7a3f;
    color: #1f7a3f;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    text-align: center;
    transition: all 0.2s;
  }
  .download-link:hover {
    background: #1f7a3f;
    color: #fff;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(44,90,160,0.3);
    border-top-color: #2c5aa0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="container">
    <h1>문서 변환기</h1>
    <p class="subtitle">파일을 업로드하고 원하는 형식으로 변환하세요</p>

    <div class="field">
      <label class="label">1. 파일 선택</label>
      <label class="file-drop" id="dropZone">
        <input type="file" id="fileInput" />
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span class="text"><strong>클릭하여 업로드</strong> 또는 파일을 끌어다 놓으세요</span>
        <span class="filename" id="filename"></span>
      </label>
    </div>

    <div class="field">
      <label class="label">2. 변환 형식 선택</label>
      <div class="format-group">
        <label class="format-option selected" data-format="excel">
          <input type="radio" name="format" value="excel" checked />
          <span class="fmt-icon">📊</span>
          <span class="fmt-name">생산작업지시서<br><small style="font-weight:400;font-size:12px;opacity:0.8">(Excel)</small></span>
        </label>
      </div>
    </div>

    <button class="convert-btn" id="convertBtn" disabled>변환하기</button>

    <div class="status" id="status"></div>
    <div class="download-area" id="downloadArea"></div>
  </div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const filenameEl = document.getElementById('filename');
const convertBtn = document.getElementById('convertBtn');
const statusEl = document.getElementById('status');
const downloadArea = document.getElementById('downloadArea');
const formatOptions = document.querySelectorAll('.format-option');

let selectedFile = null;
let selectedFormat = 'excel';

formatOptions.forEach(opt => {
  opt.addEventListener('click', () => {
    formatOptions.forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedFormat = opt.dataset.format;
    opt.querySelector('input').checked = true;
  });
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    setFile(e.target.files[0]);
  }
});

['dragenter', 'dragover'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add('dragging');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('dragging');
  });
});
dropZone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length > 0) {
    setFile(e.dataTransfer.files[0]);
  }
});

function setFile(file) {
  selectedFile = file;
  filenameEl.textContent = file.name;
  dropZone.classList.add('has-file');
  convertBtn.disabled = false;
  hideStatus();
  downloadArea.classList.remove('show');
  downloadArea.innerHTML = '';
}

function showStatus(msg, type = 'info', withSpinner = false) {
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = (withSpinner ? '<span class="spinner"></span>' : '') + msg;
}
function hideStatus() {
  statusEl.className = 'status';
}

function getExt(name) {
  return (name.split('.').pop() || '').toLowerCase();
}

convertBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  convertBtn.disabled = true;
  downloadArea.classList.remove('show');
  downloadArea.innerHTML = '';

  try {
    showStatus('변환 중입니다...', 'info', true);
    if (selectedFormat === 'jpg') {
      await convertToJpg(selectedFile);
    } else {
      await convertToExcel(selectedFile);
    }
  } catch (err) {
    console.error(err);
    showStatus('변환 실패: ' + err.message, 'error');
  } finally {
    convertBtn.disabled = false;
  }
});

async function convertToJpg(file) {
  const ext = getExt(file.name);
  const baseName = file.name.replace(/\.[^.]+$/, '');
  const imageExts = ['png','jpg','jpeg','gif','webp','bmp'];

  if (imageExts.includes(ext)) {
    const dataUrl = await imageFileToJpgDataUrl(file);
    offerDownload(dataUrl, baseName + '.jpg', 'image/jpeg');
    showStatus('변환 완료!', 'success');
    return;
  }

  if (ext === 'pdf') {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const pages = pdf.numPages;

    if (pages === 1) {
      const dataUrl = await renderPdfPageToJpg(pdf, 1);
      offerDownload(dataUrl, baseName + '.jpg', 'image/jpeg');
      showStatus('변환 완료! (1 페이지)', 'success');
      return;
    }

    const zip = new JSZip();
    for (let i = 1; i <= pages; i++) {
      showStatus(`PDF 변환 중... (${i}/${pages})`, 'info', true);
      const dataUrl = await renderPdfPageToJpg(pdf, i);
      const base64 = dataUrl.split(',')[1];
      zip.file(`${baseName}_page${String(i).padStart(2,'0')}.jpg`, base64, { base64: true });
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    offerDownloadBlob(blob, baseName + '_jpg.zip');
    showStatus(`변환 완료! (${pages} 페이지, ZIP 파일)`, 'success');
    return;
  }

  throw new Error('JPG로 변환 가능한 형식이 아닙니다. 이미지 또는 PDF 파일을 업로드하세요.');
}

function imageFileToJpgDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.onerror = () => reject(new Error('이미지를 불러올 수 없습니다.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

async function renderPdfPageToJpg(pdf, pageNum) {
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale: 2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL('image/jpeg', 0.92);
}

async function convertToExcel(file) {
  const ext = getExt(file.name);
  const baseName = file.name.replace(/\.[^.]+$/, '');

  let rawRows;
  let srcWb = null;
  if (ext === 'csv' || ext === 'tsv' || ext === 'txt') {
    const text = await file.text();
    const wb = XLSX.read(text, { type: 'string' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  } else if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    srcWb = wb;
    const ws = wb.Sheets[wb.SheetNames[0]];
    rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  } else {
    throw new Error('Excel/CSV 파일을 업로드하세요. (.xlsx, .xls, .csv, .tsv, .txt)');
  }

  let { title, items } = parseWorkOrderInput(rawRows);

  // 폭이 여러 개인 경우: 첫 시트(다중산출기)에는 현재 계산 중인 폭만 있으므로
  // 생산작업지시서 시트에 폭별로 쌓아 둔 표에서 모든 폭을 가져온다.
  if (srcWb) {
    const multi = extractAllWidths(srcWb);
    if (multi && multi.length > 0) {
      const curWidths = new Set(items.map(it => it.width));
      const multiWidths = new Set(multi.map(it => it.width));
      // 생산작업지시서 쪽이 현재 폭을 모두 포함할 때만 교체 (현재 폭이 빠져 있으면 합침)
      const coversAll = [...curWidths].every(w => multiWidths.has(w));
      items = coversAll ? multi : sortItems(mergeItems(multi.concat(items.filter(it => !multiWidths.has(it.width)))));
    }
  }
  if (items.length === 0) {
    throw new Error('규격 데이터를 찾을 수 없습니다. (예: "채움재 1000*200" 형식 필요)');
  }

  const wb = buildWorkOrderWorkbook(title || baseName, items);
  const blob = workbookToBlob(wb);
  offerDownloadBlob(blob, baseName + '_작업지시서.xlsx');
  showStatus(`변환 완료! (${items.length}개 항목)`, 'success');
}

function parseWorkOrderInput(rows) {
  const dimRegex = /^\s*(\d{2,5})\s*[*xX×]\s*(\d{2,5})\s*$/;
  let title = '';

  for (let r = 0; r < Math.min(rows.length, 8); r++) {
    for (const cell of rows[r]) {
      const text = String(cell == null ? '' : cell).trim();
      if (!text.includes('/')) continue;
      const m = text.match(/\/\s*(.+)$/);
      if (m && /[가-힣]/.test(m[1])) {
        title = m[1].trim();
        break;
      }
    }
    if (title) break;
  }
  title = title.replace(/\d{4}[.\s/-]+\d{1,2}[.\s/-]+\d{1,2}\.?/g, '').trim();
  const tnorm = title.match(/^([가-힣A-Za-z0-9]+)\s*-\s*([^()]+?)\s*\(([^)]+)\)\s*$/);
  if (tnorm) {
    title = `${tnorm[1]} - ${tnorm[2].trim()}(${tnorm[3]})`;
  }

  let specCol = -1, qtyCol = -1, headerRow = -1;
  for (let r = 0; r < Math.min(rows.length, 12); r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const v = String(row[c] == null ? '' : row[c]).trim();
      if (v === '규격') specCol = c;
      if (v === '수량') qtyCol = c;
    }
    if (specCol !== -1 && qtyCol !== -1) { headerRow = r; break; }
  }

  const itemMap = new Map();

  if (specCol !== -1 && qtyCol !== -1) {
    for (let r = headerRow + 1; r < rows.length; r++) {
      const row = rows[r];
      const spec = String(row[specCol] == null ? '' : row[specCol]).trim();
      const qtyRaw = String(row[qtyCol] == null ? '' : row[qtyCol]).trim();
      if (/^계$|^합계/.test(String(row[0] || '').trim())) break;

      const m = spec.match(dimRegex);
      if (!m) continue;
      const length = parseInt(m[1], 10);
      const width = parseInt(m[2], 10);
      const qty = parseInt(qtyRaw.replace(/[^\d-]/g, ''), 10);
      if (!length || !width || !qty || qty <= 0) continue;

      const key = `${width}|${length}`;
      if (itemMap.has(key)) itemMap.get(key).qty += qty;
      else itemMap.set(key, { width, length, qty });
    }
  } else {
    const fallbackRegex = /(\d{2,5})\s*[*×]\s*(\d{2,5})/;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r].map(c => String(c == null ? '' : c).trim());
      const joined = row.join(' | ');
      const m = joined.match(fallbackRegex);
      if (!m) continue;
      const length = parseInt(m[1], 10);
      const width = parseInt(m[2], 10);
      if (!length || !width) continue;
      let qty = null;
      for (const cell of row) {
        if (!cell || cell.includes(m[0])) continue;
        const qm = cell.match(/^\s*(\d+)\s*(?:개|ea|EA|pcs|PCS)?\s*$/);
        if (qm) { qty = parseInt(qm[1], 10); break; }
      }
      if (!qty || qty <= 0) continue;
      const key = `${width}|${length}`;
      if (itemMap.has(key)) itemMap.get(key).qty += qty;
      else itemMap.set(key, { width, length, qty });
    }
  }

  const items = sortItems(Array.from(itemMap.values()));

  return { title, items };
}

// 폭 내림차순, 같은 폭 안에서는 길이 내림차순 (같은 폭끼리 붙어 있어야 폭 칸이 병합됨)
function sortItems(items) {
  return items.slice().sort((a, b) => (b.width - a.width) || (b.length - a.length));
}

// 폭·길이가 같은 항목은 수량 합산
function mergeItems(items) {
  const map = new Map();
  for (const it of items) {
    const key = `${it.width}|${it.length}`;
    if (map.has(key)) map.get(key).qty += it.qty;
    else map.set(key, { ...it });
  }
  return Array.from(map.values());
}

// 생산작업지시서(또는 채움재작업지시서) 시트에서 모든 폭의 채움재를 읽는다.
// 이 시트에는 "채움재 / 수량" 표가 여러 개(왼쪽: 현재 폭, 오른쪽: 폭별 누적) 있을 수 있어
// 각 표를 읽은 뒤 폭 종류가 가장 많은 표를 사용한다.
function extractAllWidths(wb) {
  const sheetName = ['생산작업지시서', '채움재작업지시서'].find(n => wb.Sheets[n]);
  if (!sheetName) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
  const dimRegex = /^\s*(\d{2,5})\s*[*xX×]\s*(\d{2,5})\s*$/;
  const str = v => String(v == null ? '' : v).trim();

  // 헤더 행 찾기: "채움재..." 로 시작하는 칸이 있는 행
  let headerRow = -1;
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    if (rows[r].some(v => str(v).startsWith('채움재'))) { headerRow = r; break; }
  }
  if (headerRow === -1) return null;

  const header = rows[headerRow];
  const blocks = [];
  for (let c = 0; c < header.length; c++) {
    if (!str(header[c]).startsWith('채움재')) continue;
    let q = -1;
    for (let k = c + 1; k < Math.min(header.length, c + 5); k++) {
      if (str(header[k]).startsWith('수량')) { q = k; break; }
    }
    if (q !== -1) blocks.push({ specCol: c, qtyCol: q });
  }

  let best = null, bestWidths = 0;
  for (const { specCol, qtyCol } of blocks) {
    const list = [];
    for (let r = headerRow + 1; r < rows.length; r++) {
      const row = rows[r];
      // 합계 행에서 멈춤 (채움재 칸 왼쪽 두 칸 안에 "합계"가 있으면)
      if ([specCol - 1, specCol].some(c => c >= 0 && /^합계/.test(str(row[c])))) break;
      const m = str(row[specCol]).match(dimRegex);
      if (!m) continue;
      const length = parseInt(m[1], 10);
      const width = parseInt(m[2], 10);
      const qty = parseInt(str(row[qtyCol]).replace(/[^\d-]/g, ''), 10);
      if (!length || !width || !qty || qty <= 0) continue;
      list.push({ width, length, qty });
    }
    const merged = mergeItems(list);
    const nWidths = new Set(merged.map(it => it.width)).size;
    if (merged.length > 0 && nWidths >= bestWidths) { best = merged; bestWidths = nWidths; }
  }
  return best ? sortItems(best) : null;
}

function buildWorkOrderWorkbook(title, items) {
  const headers = ['폭', '길이', '수량', 'sheet', '차열재'];
  const aoa = [
    [title, '', '', '', ''],
    headers,
  ];
  for (const it of items) {
    aoa.push([it.width, it.length, it.qty, '', '']);
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [
    { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 12 }, { wch: 12 },
  ];

  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];

  let groupStart = 2;
  for (let i = 1; i <= items.length; i++) {
    const cur = items[i - 1];
    const next = items[i];
    if (!next || next.width !== cur.width) {
      const groupEnd = i + 1;
      if (groupEnd > groupStart) {
        merges.push({ s: { r: groupStart, c: 0 }, e: { r: groupEnd, c: 0 } });
      }
      groupStart = i + 2;
    }
  }
  ws['!merges'] = merges;

  const totalRows = aoa.length;
  const border = { style: 'thin', color: { rgb: '000000' } };
  const borderAll = { top: border, bottom: border, left: border, right: border };

  for (let r = 0; r < totalRows; r++) {
    for (let c = 0; c < headers.length; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      const style = {
        border: borderAll,
        alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
        font: { name: '맑은 고딕', sz: 14, bold: true },
      };
      if (r <= 1) style.fill = { fgColor: { rgb: 'FFF2CC' } };
      ws[addr].s = style;
    }
  }
  ws['!rows'] = Array.from({ length: totalRows }, () => ({ hpt: 26 }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '작업지시서');
  return wb;
}

function workbookToBlob(wb) {
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return new Blob([wbout], { type: 'application/octet-stream' });
}

function offerDownload(dataUrl, filename, mime) {
  const link = document.createElement('a');
  link.href = dataUrl;
  link.download = filename;
  link.className = 'download-link';
  link.textContent = '⬇  ' + filename + ' 다운로드';
  downloadArea.innerHTML = '';
  downloadArea.appendChild(link);
  downloadArea.classList.add('show');
}

function offerDownloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.className = 'download-link';
  link.textContent = '⬇  ' + filename + ' 다운로드';
  downloadArea.innerHTML = '';
  downloadArea.appendChild(link);
  downloadArea.classList.add('show');
}
